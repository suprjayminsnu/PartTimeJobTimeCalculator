<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>알바 시간 계산기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<style>
  /* Pretendard fallback via cdn */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

  body, button, input, select, textarea {
    font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Segoe UI", sans-serif !important;
    font-feature-settings: "tnum" on, "lnum" on;
  }

  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #1f1f1f;
    --muted: #6b6b6b;
    --muted-2: #9a9a9a;
    --line: #ececec;
    --line-strong: #d8d8d8;
    --accent: #0a0a0a;
    --tint: #f3f3f1;
    --weekend: #b91c1c;
    --shadow-soft: 0 1px 2px rgba(0,0,0,0.04), 0 8px 32px rgba(0,0,0,0.06);
    --shadow-modal: 0 30px 80px rgba(0,0,0,0.18), 0 4px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "tnum" on, "lnum" on;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px 80px;
  }

  .topbar {
    width: 100%;
    max-width: 1180px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    display: grid; place-items: center;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
  }
  .brand-name {
    font-size: 14px;
    letter-spacing: -0.01em;
    font-weight: 600;
  }
  .topbar-meta {
    font-family: inherit;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* Calendar shell */
  .calendar-card {
    width: 100%;
    max-width: 1180px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 40px 32px;
    box-shadow: var(--shadow-soft);
  }

  .cal-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .cal-title {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cal-year {
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .cal-month {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  .cal-month .month-num {
    font-family: inherit;
    font-weight: 500;
    color: var(--muted-2);
    margin-left: 14px;
    font-size: 32px;
    vertical-align: 6px;
  }

  .cal-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn {
    width: 40px; height: 40px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    display: grid; place-items: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .nav-btn:hover { background: var(--tint); border-color: var(--line-strong); }
  .nav-btn:active { transform: translateY(1px); }
  .today-btn {
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.01em;
  }
  .today-btn:hover { background: var(--tint); border-color: var(--line-strong); }

  /* Weekday header */
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    padding: 4px 0 12px;
  }
  .weekday {
    font-family: inherit;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    padding: 0 12px;
  }
  .weekday.sun { color: var(--weekend); }
  .weekday.sat { color: #1d4ed8; }

  /* Grid */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(118px, 1fr);
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .day-cell {
    position: relative;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
    background: var(--surface);
    transition: background 0.12s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
    text-align: left;
    border-top: none;
    border-left: none;
    color: inherit;
  }
  .day-cell:hover { background: #faf9f7; }
  .day-cell.muted { background: #fbfbfa; }
  .day-cell.muted .day-num { color: #d4d4d2; }
  .day-cell.today .day-num {
    background: var(--ink);
    color: #fff;
  }
  .day-cell.has-shift {
    background: linear-gradient(180deg, #ffffff 0%, #fafaf9 100%);
  }

  .day-num {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: 999px;
    color: var(--ink);
    margin-left: -2px;
  }
  .day-cell.sun .day-num { color: var(--weekend); }
  .day-cell.sat .day-num { color: #1d4ed8; }
  .day-cell.today.sun .day-num,
  .day-cell.today.sat .day-num { color: #fff; }

  .shift-pill {
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }
  .shift-time {
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.01em;
    opacity: 0.85;
  }
  .shift-hours {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .shift-hours .hh {
    font-family: inherit;
  }
  .shift-hours .pay {
    font-size: 10px;
    font-weight: 400;
    opacity: 0.7;
    font-family: inherit;
  }

  .add-hint {
    position: absolute;
    inset: auto 10px 10px auto;
    width: 22px; height: 22px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted-2);
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity 0.15s ease;
    font-size: 16px;
    line-height: 1;
  }
  .day-cell:hover .add-hint { opacity: 1; }

  /* Summary */
  .summary {
    width: 100%;
    max-width: 1180px;
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 36px;
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr 1.3fr;
    gap: 28px;
    align-items: center;
    box-shadow: var(--shadow-soft);
  }
  .sum-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-right: 1px solid var(--line);
    padding-right: 24px;
  }
  .sum-block:last-child { border-right: none; padding-right: 0; }
  .sum-label {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .sum-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .sum-value .unit {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 4px;
  }
  .sum-value .num-mono {
    font-family: inherit;
    font-weight: 700;
  }
  .sum-sub {
    font-size: 12px;
    color: var(--muted);
    font-family: inherit;
  }

  .wage-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wage-input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    text-align: right;
    outline: none;
    transition: border-color 0.15s ease;
    letter-spacing: -0.01em;
  }
  .wage-input:focus { border-color: var(--ink); }
  .wage-suffix {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 15, 15, 0.42);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: grid; place-items: center;
    z-index: 50;
    animation: fadeIn 0.18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal {
    width: 460px;
    max-width: calc(100vw - 32px);
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow-modal);
    padding: 28px;
    animation: popIn 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .modal-date {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .modal-date .dow {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 8px;
    font-family: inherit;
  }
  .modal-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    font-family: inherit;
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--tint); color: var(--ink); }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-label {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .time-input {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px;
    font-size: 18px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .time-input:focus { border-color: var(--ink); }
  .break-input {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    width: 100%;
    text-align: right;
  }
  .break-input:focus { border-color: var(--ink); }

  .preview-card {
    margin-top: 20px;
    padding: 16px 18px;
    background: var(--tint);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .preview-card .pv-label {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .preview-card .pv-val {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-family: inherit;
  }
  .preview-card .pv-pay {
    font-size: 13px;
    color: var(--muted);
    font-family: inherit;
    margin-top: 2px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    justify-content: space-between;
  }
  .btn {
    height: 46px;
    padding: 0 22px;
    border-radius: 12px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    transition: transform 0.06s ease, opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--line);
  }
  .btn.ghost:hover { background: var(--tint); }
  .btn.danger {
    background: var(--surface);
    color: #b91c1c;
    border-color: var(--line);
  }
  .btn.danger:hover { background: #fef2f2; border-color: #fecaca; }

  /* Footer */
  .footer-note {
    margin-top: 32px;
    font-family: inherit;
    font-size: 11px;
    color: var(--muted-2);
    letter-spacing: 0.04em;
  }

  /* Small icon */
  .ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  /* ========= Responsive ========= */
  @media (max-width: 900px) {
    .app { padding: 28px 14px 60px; }
    .topbar { margin-bottom: 24px; }
    .topbar-meta { display: none; }
    .calendar-card { padding: 22px 18px 18px; border-radius: 16px; }
    .cal-header { padding-bottom: 18px; margin-bottom: 14px; }
    .cal-month { font-size: 34px; }
    .cal-month .month-num { font-size: 20px; margin-left: 8px; vertical-align: 4px; }
    .cal-year { font-size: 12px; }
    .nav-btn { width: 36px; height: 36px; }
    .today-btn { height: 36px; padding: 0 14px; font-size: 12px; }
    .weekday { padding: 0 6px; font-size: 10px; letter-spacing: 0.08em; }

    .day-grid { grid-auto-rows: minmax(74px, 1fr); border-radius: 10px; }
    .day-cell { padding: 6px 6px; gap: 4px; }
    .day-num { font-size: 12px; width: 22px; height: 22px; }
    .shift-pill { padding: 5px 6px; border-radius: 6px; }
    .shift-time { font-size: 10px; }
    .shift-hours { font-size: 11px; flex-direction: column; align-items: flex-start; gap: 1px; }
    .shift-hours .pay { font-size: 9px; }
    .add-hint { opacity: 0.5; }

    .summary {
      margin-top: 16px;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px;
      padding: 20px 18px;
      border-radius: 16px;
    }
    .sum-block { border-right: none; padding-right: 0; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .sum-block:nth-last-child(-n+2) { border-bottom: none; padding-bottom: 0; }
    .sum-block[style*="span 2"] { grid-column: span 2 !important; }
    .sum-value { font-size: 22px; }
    .sum-value .unit { font-size: 12px; }
    .sum-label { font-size: 10px; letter-spacing: 0.1em; }
    .sum-sub { font-size: 11px; }

    .modal { padding: 22px 20px; border-radius: 18px; width: calc(100vw - 24px); }
    .modal-date { font-size: 19px; }
    .field-row { gap: 10px; margin-bottom: 12px; }
    .time-input { padding: 12px; font-size: 17px; }
    .break-input { padding: 12px; font-size: 15px; }
    .preview-card { padding: 14px 16px; margin-top: 16px; }
    .preview-card .pv-val { font-size: 19px; }
    .modal-actions { margin-top: 18px; }
    .btn { height: 44px; padding: 0 16px; font-size: 13px; }
  }

  @media (max-width: 480px) {
    .brand-name { font-size: 13px; }
    .cal-month { font-size: 28px; }
    .cal-month .month-num { display: none; }
    .day-grid { grid-auto-rows: minmax(62px, 1fr); }
    .day-cell { padding: 4px 4px; }
    .day-num { font-size: 11px; width: 20px; height: 20px; }
    .shift-pill { padding: 3px 4px; }
    .shift-time { font-size: 9px; }
    .shift-hours { font-size: 10px; }
    .shift-hours .pay { display: none; }
    .weekday { font-size: 9px; padding: 0 2px; }
    .summary { padding: 16px 14px; }
    .modal { padding: 18px 16px; }
  }

  /* ========= Auth screen ========= */
  .auth-screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 40px 36px 32px;
    box-shadow: var(--shadow-soft);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .auth-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .auth-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 26px;
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--tint);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .auth-tab {
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .auth-tab.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .auth-field { display: flex; flex-direction: column; gap: 6px; }
  .auth-field-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .auth-input {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s ease;
    width: 100%;
  }
  .auth-input:focus { border-color: var(--ink); }
  .auth-submit {
    margin-top: 6px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }
  .auth-submit:hover { opacity: 0.92; }
  .auth-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .auth-error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 18px;
    color: var(--muted-2);
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .auth-divider::before, .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .google-btn {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s ease;
  }
  .google-btn:hover { background: var(--tint); }
  .google-icon { width: 18px; height: 18px; }
  .auth-footnote {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--muted-2);
  }

  /* User chip */
  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .user-chip:hover { background: var(--tint); }
  .user-avatar {
    width: 28px; height: 28px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    display: grid; place-items: center;
    font-size: 12px;
    font-weight: 700;
    overflow: hidden;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);

<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const { createClient } = supabase;

/* ─── Supabase ─── */
const sb = createClient(
  'https://coeydpgwziurifvmpyoh.supabase.co',
  'sb_publishable_pEKUXTXRAbFpTFT1uZVVYw_X0cPH4XH'
);

/* ─── Helpers ─── */
const WEEKDAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const KO_DOW = ["일","월","화","수","목","금","토"];
const fmtKey = (y, m, d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const pad2 = n => String(n).padStart(2, '0');
const formatWon = n => { if (!isFinite(n)) return '0'; return Math.round(n).toLocaleString('ko-KR'); };
const minutesBetween = (start, end) => {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let s = sh*60+sm, e = eh*60+em;
  if (e <= s) e += 24*60;
  return e - s;
};

/* ─── Icons ─── */
const ChevronLeft = () => <svg className="ic" viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg>;
const ChevronRight = () => <svg className="ic" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>;
const CloseIcon = () => <svg className="ic" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>;

/* ─── Root ─── */
function Root() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      setLoading(false);
    });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => {
      setSession(session);
      setLoading(false);
    });
    return () => subscription.unsubscribe();
  }, []);

  if (loading) return (
    <div style={{display:'grid',placeItems:'center',minHeight:'100vh',fontSize:14,color:'var(--muted)'}}>
      불러오는 중...
    </div>
  );
  if (!session) return <AuthScreen />;

  const user = session.user;
  const userSession = {
    userId: user.id,
    email: user.email,
    name: user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0],
    picture: user.user_metadata?.avatar_url || user.user_metadata?.picture || null,
    provider: user.app_metadata?.provider || 'email',
  };
  return <App session={userSession} onLogout={() => sb.auth.signOut()} />;
}

/* ─── App ─── */
function App({ session, onLogout }) {
  const today = new Date();
  const [view, setView] = useState({ y: today.getFullYear(), m: today.getMonth() });
  const [shifts, setShifts] = useState({});
  const [wage, setWage] = useState(10030);
  const [modal, setModal] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [dataLoading, setDataLoading] = useState(true);
  const wageTimerRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setDataLoading(true);
      const [{ data: shiftsData }, { data: settingsData }] = await Promise.all([
        sb.from('shifts').select('date,start_time,end_time,break_min').eq('user_id', session.userId),
        sb.from('user_settings').select('wage').eq('user_id', session.userId).maybeSingle(),
      ]);
      if (cancelled) return;
      if (shiftsData) {
        const map = {};
        shiftsData.forEach(s => { map[s.date] = { start: s.start_time, end: s.end_time, breakMin: s.break_min }; });
        setShifts(map);
      }
      if (settingsData?.wage != null) setWage(settingsData.wage);
      setDataLoading(false);
    })();
    return () => { cancelled = true; };
  }, [session.userId]);

  const monthMatrix = useMemo(() => {
    const first = new Date(view.y, view.m, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
    const prevDays = new Date(view.y, view.m, 0).getDate();
    const cells = [];
    for (let i = startDow - 1; i >= 0; i--) {
      cells.push({ y: view.m === 0 ? view.y - 1 : view.y, m: view.m === 0 ? 11 : view.m - 1, d: prevDays - i, muted: true });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ y: view.y, m: view.m, d, muted: false });
    }
    while (cells.length < 42) {
      const last = cells[cells.length - 1];
      let nd = last.d + 1, nm = last.m, ny = last.y;
      const dim = new Date(ny, nm + 1, 0).getDate();
      if (nd > dim) { nd = 1; nm += 1; if (nm > 11) { nm = 0; ny += 1; } }
      cells.push({ y: ny, m: nm, d: nd, muted: nm !== view.m });
    }
    return cells;
  }, [view]);

  const monthShifts = useMemo(() => {
    const list = [];
    Object.entries(shifts).forEach(([key, val]) => {
      const [yy, mm] = key.split('-').map(Number);
      if (yy === view.y && mm === view.m + 1) list.push({ key, ...val });
    });
    return list;
  }, [shifts, view]);

  const totals = useMemo(() => {
    let totalMin = 0, days = 0;
    monthShifts.forEach(s => {
      const m = minutesBetween(s.start, s.end) - (s.breakMin || 0);
      if (m > 0) { totalMin += m; days++; }
    });
    const totalHoursDecimal = totalMin / 60;
    const grossPay = totalHoursDecimal * (wage || 0);
    const tax = grossPay * 0.033;
    return { totalMin, totalHoursDecimal, totalH: Math.floor(totalMin/60), totalM: totalMin%60, days, grossPay, tax, netPay: grossPay - tax };
  }, [monthShifts, wage]);

  const goToday = () => setView({ y: today.getFullYear(), m: today.getMonth() });
  const prevMonth = () => setView(v => v.m === 0 ? { y: v.y-1, m: 11 } : { y: v.y, m: v.m-1 });
  const nextMonth = () => setView(v => v.m === 11 ? { y: v.y+1, m: 0 } : { y: v.y, m: v.m+1 });

  const openCell = cell => setModal({ y: cell.y, m: cell.m, d: cell.d });
  const closeModal = () => setModal(null);

  const saveShift = async (key, payload) => {
    const { error } = await sb.from('shifts').upsert({
      user_id: session.userId, date: key,
      start_time: payload.start, end_time: payload.end, break_min: payload.breakMin,
    }, { onConflict: 'user_id,date' });
    if (!error) setShifts(prev => ({ ...prev, [key]: payload }));
  };

  const deleteShift = async (key) => {
    const { error } = await sb.from('shifts').delete()
      .eq('user_id', session.userId).eq('date', key);
    if (!error) setShifts(prev => { const n = { ...prev }; delete n[key]; return n; });
  };

  const handleWageChange = newWage => {
    setWage(newWage);
    clearTimeout(wageTimerRef.current);
    wageTimerRef.current = setTimeout(() => {
      sb.from('user_settings').upsert({ user_id: session.userId, wage: newWage }, { onConflict: 'user_id' });
    }, 600);
  };

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">⌗</div>
          <div className="brand-name">알바 시간 계산기</div>
        </div>
        <UserChip session={session} open={menuOpen} setOpen={setMenuOpen} onLogout={onLogout} />
      </div>
      {dataLoading
        ? <div style={{marginTop:80,color:'var(--muted)',fontSize:13}}>데이터 불러오는 중...</div>
        : <>
            <Calendar view={view} today={today} cells={monthMatrix} shifts={shifts} wage={wage}
              onPrev={prevMonth} onNext={nextMonth} onToday={goToday} onCellClick={openCell} />
            <Summary totals={totals} wage={wage} setWage={handleWageChange} view={view} />
          </>
      }
      <div className="footer-note">데이터는 Supabase에 안전하게 저장됩니다</div>
      {modal && (
        <ShiftModal
          key={fmtKey(modal.y, modal.m, modal.d)}
          ymd={modal}
          existing={shifts[fmtKey(modal.y, modal.m, modal.d)]}
          wage={wage}
          onClose={closeModal}
          onSave={async payload => { await saveShift(fmtKey(modal.y, modal.m, modal.d), payload); closeModal(); }}
          onDelete={async () => { await deleteShift(fmtKey(modal.y, modal.m, modal.d)); closeModal(); }}
        />
      )}
    </div>
  );
}

/* ─── Calendar ─── */
function Calendar({ view, today, cells, shifts, wage, onPrev, onNext, onToday, onCellClick }) {
  return (
    <div className="calendar-card">
      <div className="cal-header">
        <div className="cal-title">
          <div className="cal-year">{view.y}</div>
          <div className="cal-month">
            {["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"][view.m]}
            <span className="month-num">/ {pad2(view.m+1)}</span>
          </div>
        </div>
        <div className="cal-controls">
          <button className="today-btn" onClick={onToday}>오늘</button>
          <button className="nav-btn" onClick={onPrev} aria-label="이전 달"><ChevronLeft /></button>
          <button className="nav-btn" onClick={onNext} aria-label="다음 달"><ChevronRight /></button>
        </div>
      </div>
      <div className="weekday-row">
        {WEEKDAYS.map((w,i) => <div key={w} className={`weekday ${i===0?'sun':''} ${i===6?'sat':''}`}>{w}</div>)}
      </div>
      <div className="day-grid">
        {cells.map((c, i) => {
          const dow = new Date(c.y, c.m, c.d).getDay();
          const key = fmtKey(c.y, c.m, c.d);
          const shift = shifts[key];
          const isToday = c.y === today.getFullYear() && c.m === today.getMonth() && c.d === today.getDate();
          const cls = ["day-cell", c.muted?"muted":"", isToday?"today":"", shift?"has-shift":"", dow===0?"sun":"", dow===6?"sat":""].filter(Boolean).join(" ");
          return (
            <button key={i} className={cls} onClick={() => onCellClick(c)}>
              <div className="day-num">{c.d}</div>
              {shift && (
                <div className="shift-pill">
                  <div className="shift-time">{shift.start} \u2013 {shift.end}</div>
                  <div className="shift-hours">
                    <span className="hh">{formatShiftHours(shift)}</span>
                    {wage > 0 && <span className="pay">\u20a9{formatWon(computeMinutes(shift)/60*wage)}</span>}
                  </div>
                </div>
              )}
              {!shift && !c.muted && <div className="add-hint">+</div>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function computeMinutes(s) { return Math.max(0, minutesBetween(s.start, s.end) - (s.breakMin || 0)); }
function formatShiftHours(s) {
  const m = computeMinutes(s);
  const h = Math.floor(m/60), mm = m%60;
  if (mm === 0) return `${h}\uc2dc\uac04`;
  return `${h}\uc2dc\uac04 ${mm}\ubd84`;
}

/* ─── Summary ─── */
function Summary({ totals, wage, setWage, view }) {
  const monthLabel = `${view.y}.${pad2(view.m+1)}`;
  return (
    <div className="summary">
      <div className="sum-block">
        <div className="sum-label">{monthLabel} \ud569\uacc4</div>
        <div className="sum-value">
          <span className="num-mono">{totals.totalH}</span><span className="unit">\uc2dc\uac04</span>
          {totals.totalM > 0 && <><span className="num-mono" style={{marginLeft:8}}>{totals.totalM}</span><span className="unit">\ubd84</span></>}
        </div>
        <div className="sum-sub">{totals.totalHoursDecimal.toFixed(2)} h \u00b7 \uc18c\uc218 \ud45c\uae30</div>
      </div>
      <div className="sum-block">
        <div className="sum-label">\uadfc\ubb34 \uc77c\uc218</div>
        <div className="sum-value"><span className="num-mono">{totals.days}</span><span className="unit">\uc77c</span></div>
        <div className="sum-sub">{totals.days > 0 ? `\ud3c9\uade0 ${(totals.totalHoursDecimal/totals.days).toFixed(1)} h/\uc77c` : '\uae30\ub85d \uc5c6\uc74c'}</div>
      </div>
      <div className="sum-block">
        <div className="sum-label">\uc2dc\uae09</div>
        <div className="wage-input-wrap">
          <input className="wage-input" type="text" inputMode="numeric"
            value={wage ? wage.toLocaleString('ko-KR') : ''}
            onChange={e => { const raw = e.target.value.replace(/[^0-9]/g,''); setWage(raw ? Number(raw) : 0); }}
            placeholder="0" />
          <span className="wage-suffix">\uc6d0</span>
        </div>
        <div className="sum-sub">\uc2dc\uac04\ub2f9 \ub2e8\uac00</div>
      </div>
      <div className="sum-block" style={{gridColumn:'span 2'}}>
        <div className="sum-label">\uc608\uc0c1 \uc2e4\uc218\ub839\uc561 (\uc138\ud6c4 3.3%)</div>
        <div className="sum-value">
          <span style={{color:'var(--muted-2)',fontWeight:500,marginRight:4}}>\u20a9</span>
          <span className="num-mono">{formatWon(totals.netPay)}</span>
        </div>
        <div className="sum-sub">\uc138\uc804 \u20a9{formatWon(totals.grossPay)} \u2212 \uc138\uae08 \u20a9{formatWon(totals.tax)}</div>
      </div>
    </div>
  );
}

/* ─── ShiftModal ─── */
function ShiftModal({ ymd, existing, wage, onClose, onSave, onDelete }) {
  const [start, setStart] = useState(existing?.start || '09:00');
  const [end, setEnd] = useState(existing?.end || '18:00');
  const [breakMin, setBreakMin] = useState(existing?.breakMin ?? 60);
  const [saving, setSaving] = useState(false);

  const dateObj = new Date(ymd.y, ymd.m, ymd.d);
  const dow = KO_DOW[dateObj.getDay()];

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const workMin = Math.max(0, minutesBetween(start, end) - (Number(breakMin)||0));
  const workH = Math.floor(workMin/60), workMM = workMin%60;
  const grossPay = workMin/60*(wage||0);
  const netPay = grossPay*(1-0.033);
  const valid = workMin > 0;

  const submit = async () => {
    if (!valid || saving) return;
    setSaving(true);
    await onSave({ start, end, breakMin: Number(breakMin)||0 });
    setSaving(false);
  };

  const handleDelete = async () => {
    setSaving(true);
    await onDelete();
    setSaving(false);
  };

  return (
    <div className="modal-backdrop" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true">
        <div className="modal-head">
          <div>
            <div className="modal-date">{ymd.m+1}\uc6d4 {ymd.d}\uc77c<span className="dow">{dow}\uc694\uc77c</span></div>
            <div className="modal-sub">{ymd.y}.{pad2(ymd.m+1)}.{pad2(ymd.d)}</div>
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="\ub2eb\uae30"><CloseIcon /></button>
        </div>
        <div className="field-row">
          <div className="field">
            <div className="field-label">\ucd9c\uadfc</div>
            <input className="time-input" type="time" value={start} onChange={e => setStart(e.target.value)} step="300" />
          </div>
          <div className="field">
            <div className="field-label">\ud1f4\uadfc</div>
            <input className="time-input" type="time" value={end} onChange={e => setEnd(e.target.value)} step="300" />
          </div>
        </div>
        <div className="field">
          <div className="field-label">\ud734\uac8c\uc2dc\uac04 (\ubd84)</div>
          <input className="break-input" type="number" min="0" step="5" value={breakMin}
            onChange={e => setBreakMin(e.target.value === '' ? '' : Number(e.target.value))} placeholder="0" />
        </div>
        <div className="preview-card">
          <div>
            <div className="pv-label">\uadfc\ubb34 \uc2dc\uac04</div>
            <div className="pv-pay">{wage > 0 ? `\u20a9${formatWon(netPay)} \uc2e4\uc218\ub839 (\uc138\ud6c4 3.3%)` : '\uc2dc\uae09\uc744 \uc785\ub825\ud558\uc138\uc694'}</div>
          </div>
          <div className="pv-val">{valid ? workMM===0 ? `${workH}h` : `${workH}h ${workMM}m` : '\u2014'}</div>
        </div>
        <div className="modal-actions">
          <div>{existing && <button className="btn danger" onClick={handleDelete} disabled={saving}>\uc0ad\uc81c</button>}</div>
          <div style={{display:'flex',gap:10}}>
            <button className="btn ghost" onClick={onClose} disabled={saving}>\ucde8\uc18c</button>
            <button className="btn" onClick={submit} disabled={!valid || saving} style={(!valid||saving)?{opacity:0.4,cursor:'not-allowed'}:{}}>
              {saving ? '\uc800\uc7a5 \uc911...' : existing ? '\uc218\uc815' : '\uc800\uc7a5'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── AuthScreen ─── */
function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const toKo = msg => {
    if (!msg) return '\uc624\ub958\uac00 \ubc1c\uc0dd\ud588\uc2b5\ub2c8\ub2e4.';
    if (msg.includes('Invalid login credentials')) return '\uc774\uba54\uc77c \ub610\ub294 \ube44\ubc00\ubc88\ud638\uac00 \uc62c\ubc14\ub974\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.';
    if (msg.includes('User already registered')) return '\uc774\ubbf8 \uac00\uc785\ub41c \uc774\uba54\uc77c\uc785\ub2c8\ub2e4.';
    if (msg.includes('Password should be at least')) return '\ube44\ubc00\ubc88\ud638\ub294 6\uc790 \uc774\uc0c1\uc774\uc5b4\uc57c \ud569\ub2c8\ub2e4.';
    if (msg.includes('Email not confirmed')) return '\uc774\uba54\uc77c \uc778\uc99d\uc774 \ud544\uc694\ud569\ub2c8\ub2e4. \uba54\uc77c\ud568\uc744 \ud655\uc778\ud574\uc8fc\uc138\uc694.';
    if (msg.includes('Unable to validate email')) return '\uc62c\ubc14\ub978 \uc774\uba54\uc77c \uc8fc\uc18c\ub97c \uc785\ub825\ud574\uc8fc\uc138\uc694.';
    return msg;
  };

  const submit = async e => {
    e.preventDefault();
    setError('');
    setLoading(true);
    try {
      if (mode === 'signup') {
        const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name || email.split('@')[0] } } });
        if (error) setError(toKo(error.message));
        else setError('\uac00\uc785 \uc644\ub8cc! \uc774\uba54\uc77c \uc778\uc99d \ud6c4 \ub85c\uadf8\uc778\ud574\uc8fc\uc138\uc694.');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) setError(toKo(error.message));
      }
    } catch { setError('\uc624\ub958\uac00 \ubc1c\uc0dd\ud588\uc2b5\ub2c8\ub2e4.'); }
    setLoading(false);
  };

  const signInWithGoogle = async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname },
    });
    if (error) setError(toKo(error.message));
  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <div className="auth-brand">
          <div className="brand-mark">\u231f</div>
          <div className="brand-name">\uc54c\ubc14 \uc2dc\uac04 \uacc4\uc0b0\uae30</div>
        </div>
        <div className="auth-title">{mode === 'login' ? '\ub2e4\uc2dc \ub9cc\ub098\uc11c \ubc18\uac00\uc6cc\uc694' : '\uc2dc\uc791\ud574\ubcfc\uae4c\uc694'}</div>
        <div className="auth-sub">{mode === 'login' ? '\uc774\uba54\uc77c\ub85c \ub85c\uadf8\uc778\ud558\uac70\ub098 Google \uacc4\uc815\uc744 \uc0ac\uc6a9\ud558\uc138\uc694.' : '\uc774\uba54\uc77c\ub85c \uac00\uc785\ud558\uac70\ub098 Google \uacc4\uc815\uc744 \uc5f0\uacb0\ud558\uc138\uc694.'}</div>
        <div className="auth-tabs">
          <button className={'auth-tab '+(mode==='login'?'active':'')} onClick={() => { setMode('login'); setError(''); }}>\ub85c\uadf8\uc778</button>
          <button className={'auth-tab '+(mode==='signup'?'active':'')} onClick={() => { setMode('signup'); setError(''); }}>\ud68c\uc6d0\uac00\uc785</button>
        </div>
        <form className="auth-form" onSubmit={submit}>
          {mode === 'signup' && (
            <div className="auth-field">
              <div className="auth-field-label">\uc774\ub984</div>
              <input className="auth-input" type="text" value={name} onChange={e => setName(e.target.value)} placeholder="\ud64d\uae38\ub3d9" autoComplete="name" />
            </div>
          )}
          <div className="auth-field">
            <div className="auth-field-label">\uc774\uba54\uc77c</div>
            <input className="auth-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" required />
          </div>
          <div className="auth-field">
            <div className="auth-field-label">\ube44\ubc00\ubc88\ud638</div>
            <input className="auth-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" autoComplete={mode==='login'?'current-password':'new-password'} required />
          </div>
          {error && <div className={'auth-error'} style={error.includes('\uc644\ub8cc')?{background:'#f0fdf4',borderColor:'#bbf7d0',color:'#15803d'}:{}}>{error}</div>}
          <button className="auth-submit" type="submit" disabled={loading}>
            {loading ? '\ucc98\ub9ac \uc911...' : mode === 'login' ? '\ub85c\uadf8\uc778' : '\uac00\uc785\ud558\uae30'}
          </button>
        </form>
        <div className="auth-divider">\ub610\ub294</div>
        <button className="google-btn" onClick={signInWithGoogle}>
          <svg className="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google \uacc4\uc815\uc73c\ub85c \uacc4\uc18d\ud558\uae30
        </button>
        <div className="auth-footnote">\uacc4\uc815 \uc815\ubcf4\ub294 Supabase\uc5d0 \uc548\uc804\ud558\uac8c \uc800\uc7a5\ub429\ub2c8\ub2e4.</div>
      </div>
    </div>
  );
}

/* ─── UserChip ─── */
function UserChip({ session, open, setOpen, onLogout }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    if (open) document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open, setOpen]);
  const initial = (session.name || session.email || '?').trim()[0].toUpperCase();
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button className="user-chip" onClick={() => setOpen(!open)}>
        <div className="user-avatar">
          {session.picture ? <img src={session.picture} alt="" /> : initial}
        </div>
        <div className="user-name">{session.name || session.email}</div>
      </button>
      {open && (
        <div className="user-menu">
          <div className="um-header">
            <div className="um-header-name">{session.name || '\uc774\ub984 \uc5c6\uc74c'}</div>
            <div className="um-header-email">{session.email}</div>
          </div>
          <button className="um-item" onClick={() => setOpen(false)}>
            \uacc4\uc815: {session.provider === 'google' ? 'Google \uc5f0\uacb0\ub428' : '\uc774\uba54\uc77c'}
          </button>
          <button className="um-item danger" onClick={onLogout}>
            \ub85c\uadf8\uc544\uc6c3
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
